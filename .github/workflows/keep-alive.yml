name: Keep Render services warm

on:
  schedule:
    # Render's free tier spins a service down after ~15 minutes of no
    # traffic and takes 30-60s to cold-start the next request. Pinging
    # both services every 5 minutes keeps them warm without paying for
    # an always-on plan.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping monitor-web
        run: curl -sf -o /dev/null -w "monitor-web: %{http_code}\n" https://monitor-web-rlbg.onrender.com
      - name: Ping monitor-api
        run: curl -sf -o /dev/null -w "monitor-api: %{http_code}\n" https://monitor-api-g80z.onrender.com/healthz
